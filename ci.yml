env:
  FOUNDRY_ARTIFACTS_URL:
    uri-role: foundry-artifacts-api
  FOUNDRY_CLI_ENABLE_SERVICE_DISCOVERY:
    constant: "true"
  FOUNDRY_CLI_HOME_RELATIVE_PATH:
    constant: .local/bin/foundry
  FOUNDRY_EXTERNAL_HOST:
    uri-role: foundry-artifacts-api
  FOUNDRY_INSTALLATION_JOB_RID_HOME_RELATIVE_PATH:
    constant: .foundry-ci/installation-job-rid
  NODE_DIST_URI:
    uri-role: node-dist-uri
  NO_COLOR:
    constant: "1"
required-job-token-capabilities:
  - superrepo-publish

jobs:
  foundry-publish:
    timeout: 20 minutes
    order: 1
    steps:
      - |
        set -euo pipefail

        export FOUNDRY_TOKEN="${JOB_TOKEN}"

        BINARY_PATH="${HOME}/${FOUNDRY_CLI_HOME_RELATIVE_PATH}"
        INSTALL_DIR="${BINARY_PATH%/*}"
        JOB_RID_FILE="${HOME}/${FOUNDRY_INSTALLATION_JOB_RID_HOME_RELATIVE_PATH}"
        mkdir -p "$INSTALL_DIR" "${JOB_RID_FILE%/*}"
        : > "$JOB_RID_FILE"

        export NODE_EXTRA_CA_CERTS="${SSL_CERT_FILE:-$DEFAULT_CA_PATH}"
        export SSL_CERT_FILE="${SSL_CERT_FILE:-$DEFAULT_CA_PATH}"
        export REQUESTS_CA_BUNDLE="${SSL_CERT_FILE:-$DEFAULT_CA_PATH}"

        node_version=v24.14.1
        filename="node-${node_version}-linux-x64.tar.gz"
        url="${NODE_DIST_URI%/}/${node_version}/${filename}"

        mkdir -p .node-installation && pushd .node-installation
        python3 - "$url" "$filename" <<'PY'
        import sys, requests, os
        url, filename = sys.argv[1:3]
        r = requests.get(url, headers={"Authorization": f"Bearer {os.environ['FOUNDRY_TOKEN']}"}, timeout=300)
        r.raise_for_status()
        open(filename, "wb").write(r.content)
        PY

        tar -xzf "$filename"
        export PATH="$(pwd)/node-${node_version}-linux-x64/bin:$PATH"
        popd

        {
          echo "registry=${FOUNDRY_ARTIFACTS_URL}/repositories/ri.artifacts.repository.artifactory.external-npm-npmjs/contents/release/npm/"
          echo "//${FOUNDRY_ARTIFACTS_URL#https://}/:_authToken=\${FOUNDRY_TOKEN}"
        } > ~/.npmrc


        export FOUNDRY_CLI_TOKEN_PATH="${HOME}/.token"
        printf '%s' "$FOUNDRY_TOKEN" > "$FOUNDRY_CLI_TOKEN_PATH"
        chmod 600 "$FOUNDRY_CLI_TOKEN_PATH"

        CLI_ARTIFACTS_REPOSITORY="ri.foundry.cli.artifacts.repository"
        DOWNLOAD_URL="${FOUNDRY_ARTIFACTS_URL}/repositories/${CLI_ARTIFACTS_REPOSITORY}/contents/release/files/cli-linux-amd64-latest"

        echo "Installing Foundry CLI from ${DOWNLOAD_URL}" >&2

        echo "Installing Foundry CLI to ${BINARY_PATH}" >&2

        python3 - "${DOWNLOAD_URL}" "${BINARY_PATH}" >&2 <<'PY'
        import os, sys, urllib.error, urllib.request

        url, dest = sys.argv[1], sys.argv[2]
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['FOUNDRY_TOKEN']}"})

        try:
            with urllib.request.urlopen(req) as r, open(dest, "wb") as f:
                while chunk := r.read(655360):
                    print('.', end="", flush=True)
                    f.write(chunk)
        except urllib.error.HTTPError as e:
            sys.stderr.write(f"\nHTTP {e.code}: {e.reason}\n")
            sys.stderr.write(e.read().decode("utf-8", errors="replace"))
            sys.stderr.write("\n")
            raise SystemExit(1) from None
        PY

        chmod +x "${BINARY_PATH}"
        export PATH="$INSTALL_DIR:$PATH"
        foundry --version

        unset $(printenv | awk -F= '/^npm_config/{print $1}')

        npm install -g pnpm@11.12.0
        foundry install pnpm
        if [[ -n "${JEMMA_TAG:-}" ]] && [[ "${JEMMA_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export FOUNDRY_PRODUCT_VERSION="${JEMMA_TAG}"
            pnpm run build
            if [[ "${JEMMA_TAG}" == "0.0.1" ]]; then
                echo 'Skipping Foundry deploy for the initial 0.0.1 tag'
            else
                foundry deploy --job-rid-output "$JOB_RID_FILE"
            fi
        else
            pnpm run build
            echo 'Skipping publishing because $JEMMA_TAG is either not set or is not a valid semantic version (such as 0.0.1). Please tag your commit with a valid version to publish the SuperRepo.'
        fi


  foundry-install:
    timeout: 35 minutes
    order: 2
    steps:
      - |
        set -euo pipefail

        if [[ -n "${JEMMA_TAG:-}" ]] && [[ "${JEMMA_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${JEMMA_TAG}" != "0.0.1" ]]; then
            export FOUNDRY_TOKEN="${JOB_TOKEN}"

            export SSL_CERT_FILE="${SSL_CERT_FILE:-$DEFAULT_CA_PATH}"

            export FOUNDRY_CLI_TOKEN_PATH="${HOME}/.token"
            printf '%s' "$FOUNDRY_TOKEN" > "$FOUNDRY_CLI_TOKEN_PATH"
            chmod 600 "$FOUNDRY_CLI_TOKEN_PATH"

            BINARY_PATH="${HOME}/${FOUNDRY_CLI_HOME_RELATIVE_PATH}"
            JOB_RID_FILE="${HOME}/${FOUNDRY_INSTALLATION_JOB_RID_HOME_RELATIVE_PATH}"

            if [[ ! -x "$BINARY_PATH" ]]; then
                echo "Foundry CLI was not installed by foundry-publish at ${BINARY_PATH}" >&2
                exit 1
            fi
            if [[ ! -s "$JOB_RID_FILE" ]]; then
                echo "foundry-publish did not produce an installation job RID at ${JOB_RID_FILE}" >&2
                exit 1
            fi

            IFS= read -r JOB_RID < "$JOB_RID_FILE"
            "$BINARY_PATH" deploy poll --job-rid "$JOB_RID" --timeout-secs 1800
        else
            echo 'Skipping installation polling because this build did not submit a Foundry deployment.'
        fi
